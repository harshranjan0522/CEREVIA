<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<title>CEREVIA — Check in</title>
<meta name="description" content="Log how you feel, how strongly, and what is behind it.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/cerevia.css">
<script>
    /* Applied before first paint so the page never flashes the wrong theme. */
    (function () {
        try {
            var pref = localStorage.getItem('cerevia.theme') || 'system';
            var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            var mood = localStorage.getItem('cerevia.lastMood');
            var tint = localStorage.getItem('cerevia.moodTint') === 'on';
            if (mood && tint) document.documentElement.setAttribute('data-mood-colour', mood);
        } catch (e) { /* private mode */ }
    })();
</script>
</head>
<body>
<div class="shell">
<main class="canvas" id="main">

    <header class="page-head">
        <div>
            <p class="eyebrow">Check in</p>
            <h1 class="page-title">How are you, <em>actually</em>?</h1>
            <p class="page-lede">Pick the closest word. There is no right answer, and nothing here is graded.</p>
        </div>
    </header>

    <div class="grid">
        <section class="card span-8 card--pad card--tabbed">
            <p class="card__label">Step one — the feeling</p>
            <div class="dial" id="dial" role="group" aria-label="Choose a mood"></div>
            <p class="card__note" id="moodBlurb" style="margin-top:16px;min-height:22px"></p>

            <div class="intensity">
                <div class="intensity__head">
                    <span class="field__label" style="margin:0">Step two — how strongly</span>
                    <span><span class="intensity__value" id="levelValue">5</span><span class="intensity__word" id="levelWord">steady</span></span>
                </div>
                <input type="range" id="level" min="1" max="10" value="5" step="1" aria-label="Intensity from 1 to 10">
                <div class="scale-marks"><span>barely there</span><span>all-consuming</span></div>
            </div>

            <label class="field" style="margin-top:26px">
                <span class="field__label">Step three — what is behind it <span class="muted" style="text-transform:none;letter-spacing:0">(optional)</span></span>
                <textarea class="textarea" id="note" rows="3" maxlength="2000"
                          placeholder="A sentence is plenty. Nobody else reads this."></textarea>
            </label>

            <p class="field__label">Tag it</p>
            <div class="row" id="tagRow" style="margin-bottom:22px"></div>

            <div class="row row--between">
                <button class="btn btn--accent" type="button" id="saveMood">Save this check-in</button>
                <button class="btn btn--danger btn--sm" type="button" id="clearAll">Clear all history</button>
            </div>
        </section>

        <section class="card span-4 self-start">
            <p class="card__label">Since you started</p>
            <p class="stat"><span id="totalCheckins">0</span><span class="stat__unit">check-ins</span></p>
            <p class="stat__caption" id="totalCaption">Your first one is the hardest.</p>
            <div class="spread" id="spread" style="margin-top:22px"></div>
        </section>

        <section class="card span-12">
            <div class="card__label">
                <span>Your log</span>
                <span class="muted" id="logCount"></span>
            </div>
            <div class="row" id="filterRow" style="margin-bottom:12px"></div>
            <div class="log" id="moodLog"></div>
        </section>
    </div>

</main>
</div>
<script type="module" src="assets/js/page-mood.js"></script>
</body>
</html>
