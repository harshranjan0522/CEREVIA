<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<title>CEREVIA — Toolkit</title>
<meta name="description" content="Reading, listening and activities matched to how you last felt.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/cerevia.css">
<script>
    /* Applied before first paint so the page never flashes the wrong theme. */
    (function () {
        try {
            var pref = localStorage.getItem('cerevia.theme') || 'system';
            var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            var mood = localStorage.getItem('cerevia.lastMood');
            var tint = localStorage.getItem('cerevia.moodTint') === 'on';
            if (mood && tint) document.documentElement.setAttribute('data-mood-colour', mood);
        } catch (e) { /* private mode */ }
    })();
</script>
</head>
<body>
<div class="shell">
<main class="canvas" id="main">

    <header class="page-head">
        <div>
            <p class="eyebrow">Toolkit</p>
            <h1 class="page-title">Matched to <em>where you are</em></h1>
            <p class="page-lede">CEREVIA reads your most recent check-in and pulls the material most likely to help with that specific state.</p>
        </div>
        <button class="btn btn--ghost" type="button" id="refreshBtn">Refresh</button>
    </header>

    <div class="grid">
        <section class="card span-5 card--tabbed self-start">
            <p class="card__label">Reading from</p>
            <div class="row" style="gap:16px;align-items:center">
                <span class="icon-fill" id="moodGlyph" style="width:56px;height:56px;color:var(--mood);flex:none"></span>
                <div>
                    <h2 class="card__title" id="moodName">Loading…</h2>
                    <p class="card__note" id="moodMeta"></p>
                </div>
            </div>
            <p class="card__note" style="margin-top:18px" id="moodExplain"></p>
        </section>

        <section class="card span-7">
            <p class="card__label">Companion techniques</p>
            <p class="card__note" style="margin-bottom:14px">Short exercises the companion can walk you through in conversation.</p>
            <div class="row" id="techniqueChips"></div>
            <div id="techniqueDetail" style="margin-top:16px"></div>
        </section>

        <section class="card span-12" id="resourceGrid">
            <div class="grid" id="resourceInner"></div>
        </section>
    </div>

</main>
</div>
<script type="module" src="assets/js/page-eq.js"></script>
</body>
</html>
