<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<title>CEREVIA — Journal</title>
<meta name="description" content="Write it out. Entries are encrypted before they touch the database.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/cerevia.css">
<script>
    /* Applied before first paint so the page never flashes the wrong theme. */
    (function () {
        try {
            var pref = localStorage.getItem('cerevia.theme') || 'system';
            var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            var mood = localStorage.getItem('cerevia.lastMood');
            var tint = localStorage.getItem('cerevia.moodTint') === 'on';
            if (mood && tint) document.documentElement.setAttribute('data-mood-colour', mood);
        } catch (e) { /* private mode */ }
    })();
</script>
</head>
<body>
<div class="shell">
<main class="canvas" id="main">

    <header class="page-head">
        <div>
            <p class="eyebrow">Journal</p>
            <h1 class="page-title">Say it <em>properly</em></h1>
            <p class="page-lede">Longer than a mood, more private than a conversation. Entries are encrypted on disk.</p>
        </div>
        <p class="chip chip--static" id="privacyChip"></p>
    </header>

    <div class="grid">
        <section class="card span-8 card--pad card--tabbed">
            <div class="card__label">
                <span>New entry · <span id="todayLabel"></span></span>
                <button class="btn btn--quiet btn--sm" type="button" id="newPrompt">New prompt</button>
            </div>

            <p class="entry__prompt" id="promptText">Loading a prompt…</p>

            <textarea class="textarea" id="entry" rows="12"
                      placeholder="Start anywhere. It does not have to make sense yet."></textarea>

            <div class="row row--between" style="margin-top:14px">
                <span class="field__hint" id="counter">0 words</span>
                <div class="row">
                    <button class="btn btn--quiet btn--sm" type="button" id="usePrompt">Use this prompt</button>
                    <button class="btn btn--accent" type="button" id="saveEntry">Save entry</button>
                </div>
            </div>
            <p class="field__hint" id="draftNote"></p>
        </section>

        <section class="card span-4 self-start">
            <p class="card__label">Your writing</p>
            <p class="stat"><span id="entryCount">0</span><span class="stat__unit">entries</span></p>
            <p class="stat__caption" id="wordCount">0 words in total</p>
            <p class="card__note" style="margin-top:18px" id="lastWritten"></p>
            <button class="btn btn--danger btn--sm" type="button" id="clearJournal" style="margin-top:20px">Delete every entry</button>
        </section>

        <section class="card span-12">
            <div class="card__label">
                <span>Past entries</span>
                <span class="muted" id="resultCount"></span>
            </div>
            <label class="field">
                <span class="visually-hidden">Search entries</span>
                <input class="input" type="search" id="search" placeholder="Search everything you have written…">
            </label>
            <div id="entryList"></div>
        </section>
    </div>

</main>
</div>
<script type="module" src="assets/js/page-journal.js"></script>
</body>
</html>
